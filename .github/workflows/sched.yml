name: sched-6.1
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract GPV6.1
        run: |
          curl -fsSL https://raw.githubusercontent.com/Baskerville42/outage-data-ua/refs/heads/main/data/odesa.json -o src.json
          jq -c '{fact:{data:(.fact.data|with_entries(select(.value["GPV6.1"]) | .value={"GPV6.1":.value["GPV6.1"]})),
                        update:.fact.update},
                  preset:{data:{"GPV6.1":.preset.data["GPV6.1"]}},
                  lastUpdateStatus:{ok:.lastUpdateStatus.ok}}' src.json > odesa61.json
      - name: Commit if changed
        run: |
          git config user.name sched-bot; git config user.email sched-bot@users.noreply.github.com
          git add odesa61.json
          git diff --cached --quiet || (git commit -m "update 6.1" && git push)
